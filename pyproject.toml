[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q8bot"
version = "0.1.0"
description = "Python control library and app for the Q8bot quadruped robot"
readme = "README.md"
requires-python = ">=3.9"
# The LICENSE file lives at the repo root, outside this project dir, so name
# the license rather than pointing at a path a build can't package.
license = { text = "MIT" }
authors = [{ name = "Yufeng (Eric) Wu", email = "yufeng.wu0902@gmail.com" }]

# The library core - gaits, kinematics, protocol, Q8Bot - needs nothing else.
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# Keyboard/gamepad input and the operate.py window.
app = ["pygame>=2.5.2"]
# The desktop control window (q8bot.ui). pygame comes too - gamepad
# enumeration reuses control_config.py's per-controller mappings.
gui = ["PySide6>=6.6", "pygame>=2.5.2", "pyqtgraph>=0.13", "PyOpenGL>=3.1", "numpy>=1.26",
       # The in-app firmware flasher (q8bot.firmware_flasher).
       "esptool>=4.7"]
# Only k_solver.fk_solve() needs this, and it imports it on demand.
fk = ["scipy>=1.11.4"]

[project.scripts]
q8bot-gui = "q8bot.ui:main"

[tool.setuptools]
packages = ["q8bot", "q8bot.ui"]

[tool.setuptools.package-data]
# The 3D viewer's mesh, so it survives a pip install (see q8bot/assets).
"q8bot" = ["assets/*.stl"]
