[build-system]
requires = ["setuptools>=68"]
# setuptools, plus a check that the bundled firmware is the latest release -
# every build fails otherwise (see build_backend.py, check_firmware_bins.py).
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "q8bot"
# Written once, as q8bot.__version__ (see [tool.setuptools.dynamic]); tag each
# release vX.Y.Z to match. The firmware has its own version line.
dynamic = ["version"]
description = "Python control library and app for the Q8bot quadruped robot"
readme = "README.md"
requires-python = ">=3.9"
# The LICENSE file lives at the repo root, outside this project dir, so name
# the license rather than pointing at a path a build can't package.
license = { text = "MIT" }
authors = [{ name = "Yufeng (Eric) Wu", email = "yufeng.wu0902@gmail.com" }]

# The library core - gaits, kinematics, protocol, Q8Bot - needs nothing else.
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# The desktop control window (q8bot.ui). pygame comes too - gamepad
# enumeration reuses control_config.py's per-controller mappings.
gui = ["PySide6>=6.6", "pygame>=2.5.2", "pyqtgraph>=0.13", "PyOpenGL>=3.1", "numpy>=1.26",
       # The in-app firmware flasher (q8bot.firmware_flasher).
       "esptool>=4.7"]
# Only k_solver.fk_solve() needs this, and it imports it on demand.
fk = ["scipy>=1.11.4"]

[project.scripts]
q8bot-gui = "q8bot.ui:main"

[tool.setuptools]
# assets/ and firmware/ hold only data, but setuptools treats every
# directory in a package as a package - listing them is what keeps their
# files shipping (its warning says future versions would drop them otherwise).
packages = ["q8bot", "q8bot.ui", "q8bot.assets", "q8bot.firmware"]

[tool.setuptools.dynamic]
version = { attr = "q8bot.__version__" }

[tool.setuptools.package-data]
# The 3D viewer's mesh, and the firmware the Flash Firmware window writes,
# so both survive a (non-editable) pip install.
"q8bot.assets" = ["*.stl"]
"q8bot.firmware" = ["*.bin"]
