[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q8botone-sim"
version = "0.1.0"
description = "Q8botOne in MuJoCo: the robot model, and tools to pose and drive it"
requires-python = ">=3.10"
# Also needs the q8bot library (q8botone-python), installed from its own
# checkout - it isn't on PyPI, so it isn't listed here.
dependencies = ["mujoco>=3.2", "numpy"]

[project.optional-dependencies]
# model/build.py and model/render.py
build = ["pyyaml", "fast-simplification", "pillow"]

[tool.setuptools]
# Install it editable (pip install -e): the model lives in model/, beside
# the package rather than inside it, and sim.py finds it there.
packages = ["q8botone_sim"]
