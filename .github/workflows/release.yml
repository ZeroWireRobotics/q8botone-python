# The desktop app for Windows, macOS and Linux - each built with the
# simulator in it and self-tested - and the Windows Firmware
# Flasher. A version tag (v0.2.0) publishes them as a GitHub Release, with
# appbuild/release-notes/<tag>.md as its text; a push to the release-check
# branch builds and tests them without releasing anything.

name: Release builds

on:
  push:
    tags: ['v*']
    branches: ['release-check']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022 }
          - { name: macOS (Apple Silicon), os: macos-14 }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Linux libraries (Qt, OpenGL, a display for the self-test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1

      - name: Install, as the README says
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,sim]"
          pip install pyinstaller pillow

      - name: Build the app
        run: python appbuild/build.py

      - name: Self-test the build
        run: python appbuild/build.py --test

      - name: Build the Firmware Flasher
        if: runner.os == 'Windows'
        run: python appbuild/build.py --flasher

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            dist/Q8botOne-*.exe
            dist/Q8botOne-*.zip
            dist/Q8botOne-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Q8botOne ${{ github.ref_name }}
          body_path: appbuild/release-notes/${{ github.ref_name }}.md
          files: dist/*
